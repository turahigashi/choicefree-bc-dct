name = "mathdemo"
version = "0.6.0"
description = "A choice-free Lean 4 formalization of the profile route to the Bishop-Cheng dominated convergence theorem, over presented reals."
keywords = ["mathematics", "constructive-mathematics", "measure-theory", "dominated-convergence", "bishop", "choice-free"]
license = "Apache-2.0"
defaultTargets = ["Mathdemo"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "Mathdemo"
